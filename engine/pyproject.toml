[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "september-engine"
version = "3.2.0"
description = "September intelligence engine"
requires-python = ">=3.11"
dependencies = [
    "pydantic~=2.0",
    "aiosqlite~=0.20",
    "sqlite-vec>=0.1.7",
    # Floor is a security floor, not a feature floor: 48.0.1 clears the advisory
    # backlog that 43.x carried. Used for Fernet (credential store), and x509 /
    # ec / hashes (the sandbox MITM proxy CA).
    "cryptography>=48.0.1,<49",
    # Distribution "septemberai" installs as the module `september` - the names
    # differ, so an import search for "septemberai" finds nothing. Used by
    # herald/catalog_sync.py, memory/embeddings.py, server.py.
    "septemberai>=1.2.0,<2",
    "httpx~=0.27",
    "jsonschema~=4.21",
    "fastapi~=0.115",
    "uvicorn~=0.34",
    "pyyaml~=6.0",
    # Security floor: 12.3.0 clears the advisory backlog 11.x carried. Used only
    # by herald/image_resize.py (Image.open / resize / convert / save).
    "Pillow>=12.3.0,<13",
]

[project.optional-dependencies]
# The terminal UI (tui.py, reached via `python -m src`). The uvicorn server
# path never imports it, so the runtime image does not carry it.
tui = [
    "rich~=13.0",
    "textual~=1.0",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff==0.15.16",
    "mypy==1.18.1",
    "types-PyYAML",
    "september-engine[tui]",
    # starlette's TestClient warns when it falls back to httpx 1.x. Test-only:
    # production code keeps using httpx, so this changes nothing that ships.
    "httpx2>=2.9",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["src*", "migrations", "catalog"]

[tool.setuptools.package-data]
"migrations" = ["*.sql"]
"catalog" = ["**/*.json", "**/*.yaml", "**/*.yml", "**/*.md", "**/*.txt", "**/*.sh", "**/*.py"]

[tool.pytest.ini_options]
asyncio_mode = "strict"
addopts = "-p no:capture"

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint.per-file-ignores]
# Imports here must follow `pytest.importorskip("aiosqlite")`, which gates the
# whole module on the optional aiosqlite dependency. Moving them above the
# skip-guard would break collection when aiosqlite is absent, so E402 is
# expected and correct for this file only.
"tests/test_sqlite_working_memory.py" = ["E402"]

[tool.mypy]
python_version = "3.13"
files = ["src"]
ignore_missing_imports = true
namespace_packages = true
explicit_package_bases = true
mypy_path = "."
warn_unused_ignores = true
warn_redundant_casts = true
